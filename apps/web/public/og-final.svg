  <text x="72" y="192" fill="#2A398D" font-family="system-ui,sans-serif" font-size="72" font-weight="900">La historia de la quiniela</text>
  <g transform="translate(80 270)"><circle cx="100" cy="100" r="90" fill="#2A398D"/><text x="100" y="118" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="62" font-weight="900">O</text><text x="100" y="224" text-anchor="middle" fill="#291715" font-family="system-ui,sans-serif" font-size="28" font-weight="800">Otto · 98</text></g>
